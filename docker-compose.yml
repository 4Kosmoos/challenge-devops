version: "3.8"

services: 
  mysqldb:
    image: mysql:8.0
    ports:
      - "3306:3306"
    volumes:
      - biblio-mysql-data:/var/lib/mysql
    environment: 
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: quizz
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: quizz-api
    build:
      context: ./challenge-devops-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/quizz?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user_password
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  biblio-mysql-data: